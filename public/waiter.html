<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waiter — The Copper Fork</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .table-map { display:grid; grid-template-columns: repeat(auto-fill,minmax(110px,1fr)); gap:14px; }
  .day-group { margin-bottom: 18px; }
  .table-tile { position: relative; }
  .req-badge { position:absolute; top:-8px; right:-8px; background:var(--brass,#b9843b); color:#fff; border-radius:999px;
    padding:2px 7px; font-size:0.7rem; animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%{transform:scale(1);} 50%{transform:scale(1.15);} 100%{transform:scale(1);} }
  .split-row { display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid var(--line); font-size:0.85rem; }
</style>
</head>
<body>
<div id="topbarRoot"></div>
<div class="shell">
  <div class="tabs" id="tabNav"></div>
  <div id="view"></div>
</div>
<div class="panel-overlay" id="overlay" onclick="closePanel()"></div>
<div class="panel" id="panel"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/app.js"></script>
<script>
const user = Auth.requireRole(['waiter']);
document.getElementById('topbarRoot').innerHTML = renderTopbar('Waiter');
let state = { tables: [], orders: [], menuItems: [], reservations: [], activeTab: 'tables', socket: null, panelTableId: null };

window.__getAssistantLiveData = async function() {
  const activeOrders = state.orders.filter(o => !['completed', 'cancelled', 'rejected'].includes(o.status)).length;
  const readyTakeaway = state.orders.filter(o => o.mode === 'take_away' && o.status === 'ready').length;
  const requestCount = state.tables.filter(t => t.request).length;
  return { kind: 'waiter', activeOrders, readyTakeaway, requestCount };
};

async function init() {
  state.socket = connectSocket(user.branchId);
  state.socket.on('table:updated', refreshQuiet);
  state.socket.on('order:new', () => { refreshQuiet(); toast('New order placed'); });
  state.socket.on('order:updated', (o) => { refreshQuiet(); if (o.status==='ready') toast(`Order ${o.orderNumber} is ready to serve`); });
  state.socket.on('stock:updated', refreshQuiet);
  state.socket.on('table:request', (r) => { refreshQuiet(); toast(`Table ${r.tableName} ${r.type === 'bill' ? 'wants the bill' : 'needs assistance'}`); });
  state.socket.on('reservation:new', () => refreshQuiet());
  state.socket.on('reservation:updated', () => refreshQuiet());
  mountAttendanceWidget(user.branchId);
  await loadAll();
  setTab('tables');
}
async function loadAll() {
  const [tables, orders, menu, reservations] = await Promise.all([
    Api.get('/tables/' + user.branchId),
    Api.get('/orders/' + user.branchId),
    Api.get('/menu/' + user.branchId + '?visibleOnly=true'),
    Api.get('/reservations/' + user.branchId),
  ]);
  state.tables = tables; state.orders = orders; state.menuItems = menu.items; state.reservations = reservations;
}
async function refreshQuiet() { await loadAll(); render(); if (state.panelTableId) openPanel(state.panelTableId); }

function setTab(tab) {
  state.activeTab = tab;
  const readyForPickup = state.orders.filter(o => o.mode === 'take_away' && o.status === 'ready').length;
  const dueNow = state.reservations.filter(r => r.isDueNow).length;
  const tabs = [ {id:'tables',label:'Table Map'},
    {id:'takeaway',label:`Take-Away${readyForPickup ? ' (' + readyForPickup + ')' : ''}`},
    {id:'orders',label:'Orders'}, {id:'reservations',label:`Reservations${dueNow ? ' (' + dueNow + ')' : ''}`},
    {id:'performance',label:'Performance'}, {id:'attendance',label:'My Attendance'} ];
  document.getElementById('tabNav').innerHTML = tabs.map(t => `<button class="tab ${state.activeTab===t.id?'active':''}" onclick="setTab('${t.id}')">${t.label}</button>`).join('');
  render();
}
function render() { ({tables:renderTables, takeaway:renderTakeaway, orders:renderOrders, reservations:renderReservations, performance:renderPerformance, attendance:renderMyAttendance})[state.activeTab](); }

async function renderMyAttendance() {
  const data = await Api.get(`/attendance/${user.branchId}/me`);
  document.getElementById('view').innerHTML = `
    <div class="section-title">Your shifts</div>
    ${data.open ? `<div class="card" style="background:var(--brass-soft);border:none;margin-bottom:14px">Currently on shift since ${new Date(data.open.clockIn).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>` : ''}
    <div class="grid grid-3">
      ${data.history.length === 0 ? '<p class="muted">No shifts recorded yet.</p>' : data.history.map(a => `
        <div class="card">
          <div class="flex-between"><strong>${a.date}</strong><span class="badge ${a.clockOut ? 'completed' : 'accepted'}">${a.clockOut ? 'Ended' : 'On shift'}</span></div>
          <div class="muted">In: ${new Date(a.clockIn).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>
          ${a.clockOut ? `<div class="muted">Out: ${new Date(a.clockOut).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} · ${a.durationMinutes} min</div>` : ''}
        </div>`).join('')}
    </div>
  `;
}

function renderTakeaway() {
  const takeaway = state.orders.filter(o => o.mode === 'take_away' && !['completed','cancelled','rejected'].includes(o.status));
  const ready = takeaway.filter(o => o.status === 'ready');
  const inProgress = takeaway.filter(o => o.status !== 'ready');
  const ticket = (o, highlight) => `
    <div class="ticket ${highlight ? 'urgent' : ''}">
      <div class="ticket-head"><span class="ticket-num">${o.orderNumber}</span><span class="badge ${o.status}">${statusLabel(o.status)}</span></div>
      <div class="ticket-body">
        <div class="muted">${o.customerName} ${o.customerPhone ? '· ' + o.customerPhone : ''}</div>
        <div class="muted">Pickup: ${o.scheduledFor && o.scheduledFor !== 'now' ? new Date(o.scheduledFor).toLocaleString() : 'ASAP'}</div>
        ${o.items.map(i=>`<div class="ticket-item"><span>${i.qty}× ${i.name}</span></div>`).join('')}
      </div>
      <div class="ticket-foot flex-between">
        <strong>${money(o.total)}</strong>
        <span>${o.paymentStatus === 'paid' ? '<span class="badge completed">Paid</span>' : `<button class="btn btn-brass btn-sm" onclick="pay('${o.id}','cash')">Collect cash</button>`}</span>
      </div>
      ${highlight ? `<div class="ticket-foot"><button class="btn btn-primary btn-sm" style="width:100%" onclick="markPickedUp('${o.id}')">✓ Mark picked up / served</button></div>` : ''}
    </div>`;
  document.getElementById('view').innerHTML = `
    <div class="section-title">Ready for pickup (${ready.length})</div>
    <div class="grid grid-3">
      ${ready.map(o => ticket(o, true)).join('') || '<p class="muted">Nothing waiting right now.</p>'}
    </div>
    <div class="section-title">Still with the kitchen</div>
    <div class="grid grid-3">
      ${inProgress.map(o => ticket(o, false)).join('') || '<p class="muted">No take-away orders in progress.</p>'}
    </div>
  `;
}
async function markPickedUp(orderId) {
  try {
    await Api.patch(`/orders/${user.branchId}/${orderId}/status`, { status: 'completed' });
    toast('Marked picked up'); await refreshQuiet();
  } catch (e) { toast(e.message); }
}

function renderTables() {
  document.getElementById('view').innerHTML = `
    <div class="section-title">Live table map</div>
    <div class="table-map">
      ${state.tables.map(t => `
        <div class="table-tile ${t.status}" onclick="openPanel('${t.id}')">
          ${t.request ? `<span class="req-badge">${t.request.type === 'bill' ? '🧾' : '🔔'}</span>` : ''}
          <div class="tnum">${t.number}</div>
          <div class="tstatus">${t.status}</div>
          <div class="muted" style="font-size:0.65rem">${t.seats} seats</div>
          ${t.assignedWaiterName ? `<div class="muted" style="font-size:0.6rem">${t.assignedWaiterName.split(' ')[0]}</div>` : ''}
        </div>`).join('')}
    </div>`;
}

function activeOrderForTable(tableId) {
  return state.orders.find(o => o.tableId === tableId && !['completed','cancelled','rejected'].includes(o.status));
}

function openPanel(tableId) {
  state.panelTableId = tableId;
  const table = state.tables.find(t => t.id === tableId);
  const order = activeOrderForTable(tableId);
  const panel = document.getElementById('panel');
  panel.classList.add('open'); document.getElementById('overlay').classList.add('open');

  let body = `<div class="flex-between"><h3 style="margin:0">Table ${table.number}</h3><button class="btn-outline btn btn-sm" onclick="closePanel()">✕</button></div>
    <span class="badge ${table.status}">${table.status}</span>`;

  if (table.status === 'occupied' || table.status === 'reserved') {
    body += `<div class="flex-between" style="margin-top:8px">
      <span class="muted">Waiter: ${table.assignedWaiterName || 'Unassigned'}</span>
      ${table.assignedWaiterId !== user.id ? `<button class="btn btn-outline btn-sm" onclick="assignToMe('${tableId}')">Assign to me</button>` : ''}
    </div>`;
  }

  if (table.request) {
    body += `<div class="empty-state" style="margin-top:10px;padding:10px">
      ${table.request.type === 'bill' ? '🧾 Guest asked for the bill' : '🔔 Guest needs assistance'}
      <button class="btn btn-outline btn-sm" style="margin-top:8px" onclick="clearRequest('${tableId}')">Acknowledge</button>
    </div>`;
  }

  if (order) {
    body += `
      <div class="section-title">Order ${order.orderNumber}</div>
      <span class="badge ${order.status}">${statusLabel(order.status)}</span>
      ${order.items.map(i => `<div class="cart-line"><span>${i.qty}× ${i.name}</span><span>${money(i.lineTotal)}</span></div>`).join('')}
      <div class="price-row total"><span>Total</span><span>${money(order.total)}</span></div>

      <div class="section-title">Add item</div>
      <select id="addItemSelect">${state.menuItems.map(i => `<option value="${i.id}" ${i.availabilityStatus === 'out_of_stock' ? 'disabled' : ''}>${i.name} — ${money(i.price)}${i.availabilityStatus === 'out_of_stock' ? ' (Out of stock)' : ''}</option>`).join('')}</select>
      <div class="flex" style="margin-top:8px">
        <input type="number" id="addItemQty" value="1" min="1" style="width:70px">
        <button class="btn btn-outline btn-sm" onclick="addItemToOrder('${order.id}')">Add to order</button>
      </div>

      <div class="section-title">Actions</div>
      <div class="flex" style="flex-wrap:wrap">
        ${order.status==='ready' ? `<button class="btn btn-primary btn-sm" onclick="updateStatus('${order.id}','served')">Mark served</button>` : ''}
        ${order.status==='served' ? `<button class="btn btn-primary btn-sm" onclick="updateStatus('${order.id}','completed')">Complete & clear</button>` : ''}
      </div>

      <div class="section-title">Payment</div>
      ${order.payments && order.payments.length ? order.payments.map(p => `<div class="split-row"><span>${p.payerLabel || 'Payment'} · ${p.method}</span><span>${money(p.amount)}</span></div>`).join('') : ''}
      ${order.paymentStatus !== 'paid' ? `
        <div class="flex" style="flex-wrap:wrap">
          <button class="btn btn-brass btn-sm" onclick="pay('${order.id}','cash')">Cash — full</button>
          <button class="btn btn-brass btn-sm" onclick="pay('${order.id}','upi')">UPI (show QR)</button>
          <button class="btn btn-brass btn-sm" onclick="pay('${order.id}','card')">Card</button>
        </div>
        <div class="section-title" style="margin-top:12px">Split bill</div>
        <div class="flex">
          <input type="number" id="splitParts" value="2" min="2" max="10" style="width:70px">
          <button class="btn btn-outline btn-sm" onclick="computeSplit('${order.id}')">Split evenly</button>
        </div>
        <div id="splitResult"></div>
      ` : `<span class="badge completed">Fully paid — ${order.paymentMethod}</span>`}

      <div class="section-title">Merge into another table</div>
      <div class="flex">
        <select id="mergeTarget">
          ${state.tables.filter(t => t.id !== tableId).map(t => `<option value="${t.id}">Table ${t.number} (${t.status})</option>`).join('')}
        </select>
        <button class="btn btn-outline btn-sm" onclick="mergeTables('${tableId}')">Merge here</button>
      </div>
    `;
  } else if (table.status === 'occupied') {
    body += `<div class="empty-state">No active order found for this table.</div>`;
  } else {
    body += `<div class="section-title">Take a new order</div>
      <div id="newOrderLines"></div>
      <select id="addItemSelect">${state.menuItems.map(i => `<option value="${i.id}" ${i.availabilityStatus === 'out_of_stock' ? 'disabled' : ''}>${i.name} — ${money(i.price)}${i.availabilityStatus === 'out_of_stock' ? ' (Out of stock)' : ''}</option>`).join('')}</select>
      <div class="flex" style="margin-top:8px">
        <input type="number" id="addItemQty" value="1" min="1" style="width:70px">
        <button class="btn btn-outline btn-sm" onclick="addLineToNewOrder()">Add</button>
      </div>
      <div id="newOrderCart" style="margin-top:10px"></div>
      <input placeholder="Customer name" id="walkinName" style="margin-top:10px">
      <button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="submitWalkInOrder('${tableId}')">Send to kitchen</button>
      ${table.status !== 'available' ? `<button class="btn btn-outline btn-sm" style="width:100%;margin-top:8px" onclick="setTableStatus('${tableId}','available')">Mark available</button>` : ''}
    `;
  }
  panel.innerHTML = body;
}
function closePanel() { document.getElementById('panel').classList.remove('open'); document.getElementById('overlay').classList.remove('open'); state.panelTableId = null; }

let newOrderCart = [];
function addLineToNewOrder() {
  const id = document.getElementById('addItemSelect').value;
  const qty = Number(document.getElementById('addItemQty').value);
  const item = state.menuItems.find(i => i.id === id);
  newOrderCart.push({ menuItemId: id, name: item.name, price: item.price, qty });
  document.getElementById('newOrderCart').innerHTML = newOrderCart.map(l => `<div class="cart-line"><span>${l.qty}× ${l.name}</span><span>${money(l.price*l.qty)}</span></div>`).join('');
}
async function submitWalkInOrder(tableId) {
  if (newOrderCart.length === 0) return toast('Add at least one item');
  try {
    await Api.post('/orders/' + user.branchId, {
      mode: 'dine_in', tableId, items: newOrderCart.map(l => ({ menuItemId: l.menuItemId, qty: l.qty })),
      customerName: document.getElementById('walkinName').value || 'Walk-in'
    });
    newOrderCart = [];
    toast('Order sent to kitchen');
    closePanel(); await refreshQuiet();
  } catch (e) { toast(e.message); }
}
async function addItemToOrder(orderId) {
  const menuItemId = document.getElementById('addItemSelect').value;
  const qty = Number(document.getElementById('addItemQty').value);
  try {
    await Api.post(`/orders/${user.branchId}/${orderId}/items`, { menuItemId, qty });
    toast('Item added'); await refreshQuiet();
  } catch (e) { toast(e.message); }
}
async function updateStatus(orderId, status) {
  await Api.patch(`/orders/${user.branchId}/${orderId}/status`, { status });
  toast('Status updated'); await refreshQuiet();
}
async function pay(orderId, method, amount, payerLabel) {
  await Api.patch(`/orders/${user.branchId}/${orderId}/pay`, { method, amount, payerLabel });
  toast(`Payment collected (${method})`); await refreshQuiet();
}
async function setTableStatus(tableId, status) {
  await Api.patch(`/tables/${user.branchId}/${tableId}`, { status });
  closePanel(); await refreshQuiet();
}
async function assignToMe(tableId) {
  try {
    await Api.patch(`/tables/${user.branchId}/${tableId}/assign-to-me`);
    toast('Table assigned to you'); await refreshQuiet();
  } catch (e) { toast(e.message); }
}
async function clearRequest(tableId) {
  await Api.patch(`/tables/${user.branchId}/${tableId}/request/clear`);
  toast('Request cleared'); await refreshQuiet();
}
async function computeSplit(orderId) {
  const parts = Number(document.getElementById('splitParts').value) || 2;
  const res = await Api.get(`/orders/${user.branchId}/${orderId}/split/${parts}`);
  document.getElementById('splitResult').innerHTML = res.shares.map((amt, idx) => `
    <div class="split-row">
      <span>Guest ${idx + 1} — ${money(amt)}</span>
      <span class="flex" style="gap:6px">
        <button class="btn btn-brass btn-sm" onclick="pay('${orderId}','cash',${amt},'Guest ${idx + 1}')">Cash</button>
        <button class="btn btn-brass btn-sm" onclick="pay('${orderId}','upi',${amt},'Guest ${idx + 1}')">UPI</button>
        <button class="btn btn-brass btn-sm" onclick="pay('${orderId}','card',${amt},'Guest ${idx + 1}')">Card</button>
      </span>
    </div>`).join('');
}
async function mergeTables(fromTableId) {
  const toTableId = document.getElementById('mergeTarget').value;
  if (!toTableId) return;
  try {
    const res = await Api.post(`/tables/${user.branchId}/merge`, { fromTableId, toTableId });
    toast(`Merged ${res.movedOrders} order(s) into the other table`);
    closePanel(); await refreshQuiet();
  } catch (e) { toast(e.message); }
}

function renderOrders() {
  const statuses = ['pending_acceptance','accepted','preparing','ready','served','completed'];
  document.getElementById('view').innerHTML = `
    <div class="section-title">All orders</div>
    <div class="grid grid-3">
      ${state.orders.filter(o=>!['cancelled','rejected'].includes(o.status)).map(o => `
        <div class="ticket">
          <div class="ticket-head"><span class="ticket-num">${o.orderNumber}</span><span class="badge ${o.status}">${statusLabel(o.status)}</span></div>
          <div class="ticket-body">
            <div class="muted">${o.mode==='dine_in' ? 'Table ' + (state.tables.find(t=>t.id===o.tableId)||{}).number : 'Take-away'} · ${o.customerName}</div>
            ${o.items.map(i=>`<div class="ticket-item"><span>${i.qty}× ${i.name}</span><span>${money(i.lineTotal)}</span></div>`).join('')}
          </div>
          <div class="ticket-foot flex-between"><strong>${money(o.total)}</strong><span class="muted">${timeAgo(o.createdAt)}</span></div>
        </div>`).join('')}
    </div>`;
}

function renderReservations() {
  const groups = {};
  state.reservations.filter(r => r.status === 'confirmed').forEach(r => { (groups[r.date] = groups[r.date] || []).push(r); });
  const tableLabel = (id) => { const t = state.tables.find(x => x.id === id); return t ? `Table ${t.number} (${t.seats} seats)` : null; };
  document.getElementById('view').innerHTML = `
    <div class="section-title">Upcoming reservations</div>
    ${Object.keys(groups).length === 0 ? '<div class="empty-state">No reservations yet.</div>' :
      Object.entries(groups).map(([date, list]) => `
        <div class="day-group">
          <h3>${date}</h3>
          <div class="grid grid-3">
            ${list.map(r => `
              <div class="card ${r.isDueNow ? 'urgent' : ''}">
                <div class="flex-between"><strong>${r.time}</strong><span class="badge ${r.isDueNow ? 'pending_acceptance' : 'completed'}">${r.isDueNow ? 'Arriving now' : r.guests + ' guests'}</span></div>
                <div>${r.customerName}</div>
                <div class="muted">${r.phone || ''} ${r.occasion ? '· ' + r.occasion : ''}</div>
                ${r.notes ? `<div class="muted" style="margin-top:6px">📝 ${r.notes}</div>` : ''}
                ${r.preorderItems && r.preorderItems.length ? `
                  <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line)">
                    <div class="muted" style="margin-bottom:4px">Pre-ordered:</div>
                    ${r.preorderItems.map(p => `<div class="cart-line"><span>${p.qty}× ${p.name}</span></div>`).join('')}
                  </div>` : ''}
                <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line)">
                  ${tableLabel(r.tableId) ? `<div class="muted">Table: ${tableLabel(r.tableId)}</div>` : `<div class="muted">No table auto-assigned — pick one below</div>`}
                  ${!r.tableId ? `
                    <select id="seatTable-${r.id}" style="margin-top:6px">
                      ${state.tables.filter(t=>t.status==='available' && t.seats>=r.guests).map(t=>`<option value="${t.id}">Table ${t.number} (${t.seats} seats)</option>`).join('') || '<option value="">No tables free</option>'}
                    </select>` : ''}
                  <button class="btn btn-primary btn-sm" style="margin-top:8px;width:100%" onclick="seatReservation('${r.id}')">Seat now</button>
                </div>
              </div>`).join('')}
          </div>
        </div>`).join('')}
  `;
}
async function seatReservation(id) {
  const select = document.getElementById(`seatTable-${id}`);
  const tableId = select ? select.value : undefined;
  if (select && !tableId) return toast('No table available for this party size right now');
  try {
    await Api.patch(`/reservations/${user.branchId}/${id}/seat`, tableId ? { tableId } : {});
    toast('Guest seated'); await refreshQuiet();
  } catch (e) { toast(e.message); }
}

function renderPerformance() {
  const completed = state.orders.filter(o => o.status === 'completed');
  const revenue = completed.reduce((s,o)=>s+o.total,0);
  document.getElementById('view').innerHTML = `
    <div class="section-title">Your shift performance</div>
    <div class="grid grid-4">
      <div class="card stat-card"><div class="label">Orders served</div><div class="value">${completed.length}</div></div>
      <div class="card stat-card"><div class="label">Revenue generated</div><div class="value">${money(revenue)}</div></div>
      <div class="card stat-card"><div class="label">Avg. order value</div><div class="value">${money(completed.length ? revenue/completed.length : 0)}</div></div>
      <div class="card stat-card"><div class="label">Tables active now</div><div class="value">${state.tables.filter(t=>t.status==='occupied').length}</div></div>
    </div>
    <p class="muted" style="margin-top:14px">Demo metric — a production build would scope these to orders this waiter personally served, plus customer ratings and tips.</p>
  `;
}

init();
</script>
</body>
</html>
