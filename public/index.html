<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant Application — Sign in</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  body.login-body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 20% 20%, #2F4A3C 0%, #1D2F26 60%, #16221B 100%);
    padding: 24px;s
  }
  .login-wrap { width: 100%; max-width: 420px; }
  .login-card {
    background: var(--cream); border-radius: 18px; padding: 34px 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  .login-card h1 { margin: 0 0 4px; font-size: 1.8rem; }
  .login-card p.sub { margin: 0 0 24px; color: var(--ink-soft); font-size: 0.9rem; }
  .demo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
  .demo-btn {
    background: var(--white); border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px;
    font-size: 0.78rem; text-align: left; transition: border-color 0.15s;
  }
  .demo-btn:hover { border-color: var(--brass); }
  .demo-btn strong { display: block; font-size: 0.82rem; }
  .error-msg { color: var(--rust); font-size: 0.85rem; margin-top: 8px; display: none; }
  .brandmark { color: var(--cream); text-align: center; margin-bottom: 22px; }
  .brandmark .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--brass); display: inline-block; margin-right: 8px; }
  .brandmark h2 { font-family: var(--font-display); margin: 6px 0 0; font-weight: 400; }
</style>
</head>
<body class="login-body">
  <div class="login-wrap">
    <div class="brandmark">
      <span class="dot"></span><span style="letter-spacing:2px;text-transform:uppercase;font-size:0.75rem;opacity:0.8">Restaurant Operating System</span>
    </div>
    <div class="login-card">
      <h1>Sign in</h1>
      <p class="sub">One platform, six kinds of work — dine-in, take-away, kitchen, floor, stock, and the numbers behind it all.</p>
      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" required placeholder="you@demo.com">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" required placeholder="password">
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center">Sign in</button>
        <div class="error-msg" id="errorMsg"></div>
      </form>
      <div class="muted" style="margin-top:20px;font-size:0.78rem">Demo accounts — click to autofill (password is <code>password</code>):</div>
      <div class="demo-grid" id="demoGrid"></div>
      <div style="margin-top:14px;text-align:center">
        <a href="/customer.html?guest=1" class="muted" style="font-size:0.8rem;text-decoration:underline">Or continue as a walk-in guest via table QR →</a>
      </div>
      <div style="margin-top:8px;text-align:center">
        <a href="/register-restaurant.html" class="muted" style="font-size:0.8rem;text-decoration:underline">Own a restaurant? Register it on this platform →</a>
      </div>
    </div>
  </div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/app.js"></script>
<script>
const roleRoutes = {
  super_admin: '/admin.html',
  restaurant_admin: '/admin.html',
  sub_admin: '/subadmin.html',
  waiter: '/waiter.html',
  chef: '/chef.html',
  inventory_manager: '/inventory.html',
  customer: '/customer.html'
};

async function loadDemoAccounts() {
  const { users } = await Api.get('/auth/demo-accounts');
  const grid = document.getElementById('demoGrid');
  grid.innerHTML = users.map(u => `
    <button type="button" class="demo-btn" onclick="fillLogin('${u.email}')">
      <strong>${u.role.replace(/_/g,' ')}</strong>${u.email}
    </button>
  `).join('');
}
function fillLogin(email) {
  document.getElementById('email').value = email;
  document.getElementById('password').value = 'password';
}
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorMsg = document.getElementById('errorMsg');
  errorMsg.style.display = 'none';
  try {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const { token, user } = await Api.post('/auth/login', { email, password });
    Auth.save(token, user);
    window.location.href = roleRoutes[user.role] || '/customer.html';
  } catch (err) {
    errorMsg.textContent = err.message;
    errorMsg.style.display = 'block';
  }
});
loadDemoAccounts();
</script>
</body>
</html>
